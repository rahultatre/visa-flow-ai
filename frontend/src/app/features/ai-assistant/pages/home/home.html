<main class="home-page">
  <mat-card class="form-assistant" appearance="outlined" aria-labelledby="page-title">
    <header class="page-header">
      <!-- <p class="eyebrow">Enterprise AI</p> -->
      <h1 id="page-title">Create New Visa Workflow</h1>
    </header>

    <mat-divider></mat-divider>

    <section class="prompt-section" aria-labelledby="prompt-heading" [formGroup]="promptForm">
      <!-- <h2 id="prompt-heading">Describe your form</h2> -->
       <h2 id="prompt-heading">Describe your business requirement</h2>
      <mat-form-field appearance="outline">
        <mat-label>Business requirement</mat-label>
        <textarea matInput formControlName="businessRequirement" placeholder="Describe the business requirement..." rows="5"></textarea>
      </mat-form-field>
      <aside class="example-prompts" aria-label="Example business requirements">
        <p><span aria-hidden="true">✨</span> Try one of these examples:</p>
        <ul>
          @for (prompt of examplePrompts; track prompt) {
            <li>
              <button type="button" (click)="useExamplePrompt(prompt)">{{ prompt }}</button>
            </li>
          }
        </ul>
      </aside>
      <button mat-raised-button color="primary" [disabled]="isLoading()" (click)="generate()">
        @if (isLoading()) {
        <mat-spinner diameter="20"></mat-spinner>
        } @else {
        Generate Form Schema
        }
      </button>
    </section>

    <mat-divider></mat-divider>

    <section class="json-section" aria-labelledby="json-heading">
      <h2 id="json-heading">AI Generated Result</h2>
      @if (hasSchema()) {
        <h3 class="schema-heading">{{schema()?.title}}</h3>
        <p class="schema-description">{{schema()?.description}}</p>
        <app-dynamic-form [schema]="schema()!" />
      } @else {
        <pre aria-label="Generated Form output">{{ '--' }}</pre>
      }
    </section>
  </mat-card>
</main>
